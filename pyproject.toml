[project]
name = "shelldeck"
version = "0.1.0"
description = "Terminal connection manager with an encrypted vault and one-click VPN"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
# websockets is not optional: plain uvicorn refuses WebSocket upgrades without it.
dependencies = ["asyncssh>=2.14", "starlette>=0.37", "uvicorn>=0.30", "websockets>=12"]

[project.optional-dependencies]
build = ["pyinstaller>=6"]
import = ["pyyaml>=6"]
serial = ["pyserial-asyncio>=0.6"]
# The suites need an HTTP client the app itself does not: starlette's TestClient
# is built on httpx, and test_live.py drives the real server with it.
test = ["httpx>=0.27,<0.29"]

[project.scripts]
shelldeck = "shelldeck.__main__:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["shelldeck*"]

[tool.setuptools.package-data]
shelldeck = ["static/*", "static/vendor/*", "static/vendor/fonts/*"]
