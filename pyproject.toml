[project]
name = "eazyconnector"
version = "0.1.0"
description = "Cross-platform connection manager with an encrypted local vault"
requires-python = ">=3.10"
dependencies = ["asyncssh>=2.14", "starlette>=0.37", "uvicorn>=0.30"]

[project.scripts]
eazyconnector = "eazyconnector.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["eazyconnector*"]

[tool.setuptools.package-data]
eazyconnector = ["static/*", "static/vendor/*"]
